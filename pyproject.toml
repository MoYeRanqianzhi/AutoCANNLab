[project]
name = "autocannlab"
version = "0.1.0"
description = "CANNLab 自动获取积分"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[tool.setuptools]
packages = ["autocannlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

